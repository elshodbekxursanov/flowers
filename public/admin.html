<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Flowers</title>
<link rel="stylesheet" href="/style.css">
<style>
 body{padding-bottom:40px}
 .login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:32px}
 .login h1{font-size:40px;margin-bottom:16px}
 input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;font-family:inherit;font-size:15px;background:#fff}
 .bar{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
 .layout{display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:start}
 .panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}
 .panel h2{font-size:28px;margin-bottom:14px}
 label.l{display:block;font-size:12px;color:var(--muted);margin:6px 0 4px}
 .checks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
 .checks label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
 .checks input{width:auto;margin:0}
 .row2{display:flex;gap:8px}.row2 .btn{flex:1;justify-content:center}
 table{width:100%;border-collapse:collapse;font-size:14px}
 td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
 td img{width:48px;height:60px;object-fit:cover;border-radius:8px;display:block}
 .mini{padding:6px 12px;font-size:12px}
 .err{color:#b3261e;font-size:13px;margin-top:6px}
 .ok{color:var(--green);font-size:13px;margin-top:6px}
 .preview{width:110px;height:140px;object-fit:cover;border-radius:12px;margin-bottom:8px;display:none}
 .tabs{display:flex;gap:8px;margin-bottom:14px}
 @media(max-width:900px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
let FLOWERS = {}, TAGS = {}, FL_LIST = [], CAT_LIST = [];
const root = document.getElementById('root');
const fmt = n => Number(n).toLocaleString('en-US').replace(/,/g,' ');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api = async (url, method='GET', body) => {
  const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(()=>({}));
  if (!r.ok) { if (r.status===401 && url!=='/api/admin/login') { showLogin(); } throw j; }
  return j;
};

function showLogin(){
  root.innerHTML = `<form class="login" id="lf"><h1 class="serif">Admin</h1>
  <input name="username" placeholder="Login" autocomplete="username" required>
  <input name="password" type="password" placeholder="Parol" autocomplete="current-password" required>
  <button class="btn dark" style="width:100%;justify-content:center">Kirish</button><div class="err" id="le"></div></form>`;
  document.getElementById('lf').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    try { await api('/api/admin/login','POST',f); showPanel(); }
    catch(x){ document.getElementById('le').textContent = x.error==='too_many_attempts' ? "Juda ko'p urinish. 10 daqiqadan so'ng urining." : "Login yoki parol noto'g'ri"; }
  };
}

let items = [], editing = null, imageData = null, removeImg = false, tab = 'stats', me = '', statDays = 30;

async function showPanel(){
  const fromHash = location.hash.slice(1);
  if(['stats','products','orders','flowers','cats','admins'].includes(fromHash)) tab = fromHash; // direct link to a tab
  me =(await fetch('/api/admin/me').then(r=>r.json())).user || '';
  root.innerHTML = `<div class="bar"><a class="logo" href="/"><b>F</b>lowers · admin</a>
   <div class="row2" style="flex:none"><a class="btn light" href="/" target="_blank">Saytni ko'rish</a><button class="btn" id="out">Chiqish</button></div></div>
   <div id="alerts"></div>
   <div class="layout"><div class="panel" id="formBox"></div><div class="panel"><div class="tabs"><button class="chip" data-t="stats">Statistika</button><button class="chip" data-t="products">Buketlar</button><button class="chip" data-t="orders">Buyurtmalar</button><button class="chip" data-t="flowers">Gullar</button><button class="chip" data-t="cats">Toifalar</button><button class="chip" data-t="admins">Adminlar</button></div><div id="content"></div></div></div>`;
  document.getElementById('out').onclick = async () => { await api('/api/admin/logout','POST'); showLogin(); };
  root.querySelector('.tabs').onclick = e => { const b = e.target.closest('[data-t]'); if(b){ tab=b.dataset.t; history.replaceState(null,'','#'+tab); render(); } };
  await load();
}
// Red banner on every tab: flowers/bouquets that are at or below the low-stock limit
async function loadAlerts(){
  const box = document.getElementById('alerts'); if(!box) return;
  try {
    const s = await api('/api/admin/stats?days=1');
    const fl = s.lowFlowers.map(f=>({kind:'Gul', name:f.name, stock:f.stock}));
    const bq = s.bouquets.filter(b=>b.low).map(b=>({kind:'Buket', name:b.name, stock:b.stock}));
    const all = [...fl, ...bq];
    const badge = document.querySelector('[data-t=stats]');
    if(badge) badge.innerHTML = 'Statistika' + (all.length ? ` <span style="background:#b3261e;color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:4px">${all.length}</span>` : '');
    box.innerHTML = all.length ? `<div style="background:#fdecea;border:1px solid #f1b5af;color:#8a1f17;border-radius:16px;padding:14px 18px;margin-bottom:18px">
      <b>⚠ Kam qoldi!</b> <span style="font-size:13px">(${s.thresholds.flowers} ta va undan kam)</span>
      <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px">${all.map(a=>`<span style="background:#fff;border:1px solid #f1b5af;border-radius:999px;padding:4px 12px;font-size:13px">${a.kind}: <b>${esc(a.name)}</b> — ${a.stock===0?'<b>tugagan</b>':a.stock+' ta qoldi'}</span>`).join('')}</div></div>` : '';
  } catch(x){}
}

async function load(){
  // admin endpoints return stock and recipe too
  [items, FL_LIST] = await Promise.all(['products','flowers'].map(n=>api('/api/admin/'+n)));
  CAT_LIST = await fetch('/api/categories').then(r=>r.json());
  await loadAlerts();
  FLOWERS = Object.fromEntries(FL_LIST.map(f=>[f.id,f.uz])); TAGS = Object.fromEntries(CAT_LIST.map(c=>[c.id,c.uz]));
  render();
}

function listManager(kind, list, title){
  const c = document.getElementById('content');
  c.innerHTML = `<p class="small" style="margin-bottom:12px">${list.length} ta. Buketni qo'shayotganda shu ro'yxatdan tanlanadi.</p>
  <form id="lm" style="margin-bottom:16px"><div class="row2"><input name="ru" placeholder="Ruscha"><input name="uz" placeholder="O'zbekcha"><input name="en" placeholder="English"></div>
  <button class="btn dark">${title} qo'shish</button><div id="lmm"></div></form>
  <table><tr><th>RU</th><th>UZ</th><th>EN</th>${kind==='flowers'?'<th>Qoldiq (dona)</th>':''}<th></th></tr>${list.map(x=>`<tr><td>${esc(x.ru)}</td><td>${esc(x.uz)}</td><td>${esc(x.en)}</td>${kind==='flowers'?`<td style="white-space:nowrap"><input type="number" min="0" class="stk" data-stk="${esc(x.id)}" value="${typeof x.stock==='number'?x.stock:''}" placeholder="—" style="width:84px;margin:0;padding:6px 8px"></td>`:''}<td><button class="btn mini" data-rm="${esc(x.id)}">O'chirish</button></td></tr>`).join('')}</table>
  ${kind==='flowers'?'<p class="small" style="margin-top:10px">Qoldiqni yozsangiz, shu gul hisobga olinadi: buket sotilganda avtomatik kamayadi. Bo\'sh qoldirsangiz, hisobga olinmaydi.</p>':''}`;
  c.onchange = async e => { const id=e.target.dataset.stk; if(id!==undefined){ try{ await api('/api/admin/flowers/'+encodeURIComponent(id),'PUT',{stock:e.target.value}); e.target.style.outline='2px solid #4a8a4a'; setTimeout(()=>e.target.style.outline='',700); const f=FL_LIST.find(x=>x.id===id); if(f){ if(e.target.value==='') delete f.stock; else f.stock=Number(e.target.value); } loadAlerts(); }catch(x){ e.target.style.outline='2px solid #b3261e'; } } };
  document.getElementById('lm').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    try { await api('/api/admin/'+kind,'POST',f); await load(); }
    catch(x){ document.getElementById('lmm').innerHTML = '<div class="err">Kamida bitta tilda nom yozing</div>'; }
  };
  c.onclick = async e => { const id=e.target.dataset.rm; if(id && confirm("O'chirilsinmi? Buketlardan ham olib tashlanadi.")){ await api('/api/admin/'+kind+'/'+encodeURIComponent(id),'DELETE'); await load(); } };
}

function render(){
  document.querySelectorAll('.tabs .chip').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  renderForm();
  if(tab==='stats'){
    renderStats();
  } else if(tab==='products'){
    document.getElementById('content').innerHTML = items.length ? `<table><tr><th></th><th>Nomi</th><th>Narx</th><th>Qoldiq</th><th></th></tr>${items.map(p=>`<tr>
     <td>${p.image?`<img src="${esc(p.image)}">`:''}</td><td><b>${esc(p.name)}</b><br><small style="color:var(--muted)">${p.flowers.map(f=>(FLOWERS[f]||esc(f))+((p.recipe&&p.recipe[f]>1)?' ×'+p.recipe[f]:'')).join(', ')}</small></td>
     <td>${fmt(p.price)}</td><td>${typeof p.stock==='number'?`<b style="${p.stock===0?'color:#b3261e':''}">${p.stock}</b> ta`:'—'}</td>
     <td style="white-space:nowrap"><button class="btn mini dark" data-sell="${p.id}">Sotildi</button> <button class="btn mini" data-edit="${p.id}">Tahrirlash</button> <button class="btn mini" data-del="${p.id}">O'chirish</button></td></tr>`).join('')}</table>
     <p class="small" style="margin-top:10px">"Sotildi" tugmasi: buket va undagi gullar qoldig'ini kamaytiradi va statistikaga yozadi. Mijoz Telegramda buyurtma berib, sotuv bo'lgach shuni bosing.</p>` : `<p style="color:var(--muted)">Hali buket yo'q. Chapdagi formadan birinchi buketni qo'shing.</p>`;
    document.getElementById('content').onclick = async e => {
      if(e.target.dataset.sell){
        const p = items.find(x=>x.id==e.target.dataset.sell);
        const q = prompt(`"${p.name}" nechta sotildi?`, '1'); if(q===null) return;
        try { await api('/api/admin/sales','POST',{productId:p.id, qty:Number(q)}); await load(); }
        catch(x){ alert(x.error==='not_enough_stock' ? `Qoldiq yetarli emas (bor: ${x.have} ta)` : x.error==='bad_qty' ? "Soni noto'g'ri" : 'Xatolik'); }
      }
      if(e.target.dataset.edit){ editing = items.find(p=>p.id==e.target.dataset.edit); imageData=null; removeImg=false; renderForm(); window.scrollTo({top:0,behavior:'smooth'}); }
      if(e.target.dataset.del){ const p = items.find(x=>x.id==e.target.dataset.del); if(confirm(`"${p.name}" o'chirilsinmi?`)){ await api('/api/admin/products/'+p.id,'DELETE'); if(editing&&editing.id===p.id) editing=null; await load(); } }
    };
  } else if(tab==='flowers' || tab==='cats'){
    listManager(tab==='flowers' ? 'flowers' : 'categories', tab==='flowers' ? FL_LIST : CAT_LIST, tab==='flowers' ? 'Gul turini' : 'Toifani');
  } else if(tab==='admins'){
    api('/api/admin/admins').then(list=>{
      const c = document.getElementById('content');
      c.innerHTML = `<table><tr><th>Login</th><th></th></tr>${list.map(u=>`<tr><td><b>${esc(u)}</b>${u===me?' <small style="color:var(--muted)">(siz)</small>':''}</td><td>${u===me?'':`<button class="btn mini" data-rmadmin="${esc(u)}">O'chirish</button>`}</td></tr>`).join('')}</table>
      <h2 class="serif" style="margin-top:22px;font-size:24px">Yangi admin qo'shish</h2>
      <form id="af"><input name="username" placeholder="Login (harf, raqam)" required autocomplete="off"><input name="password" type="password" placeholder="Parol (kamida 4 belgi)" required autocomplete="new-password"><button class="btn dark">Admin yaratish</button><div id="am"></div></form>`;
      c.onclick = async e => { const u=e.target.dataset.rmadmin; if(u && confirm(`"${u}" admini o'chirilsinmi?`)){ await api('/api/admin/admins/'+encodeURIComponent(u),'DELETE'); render(); } };
      document.getElementById('af').onsubmit = async e => {
        e.preventDefault();
        const f = Object.fromEntries(new FormData(e.target));
        try { await api('/api/admin/admins','POST',f); render(); setTimeout(()=>{const m=document.getElementById('am'); if(m) m.innerHTML='<div class="ok">Admin yaratildi</div>';},300); }
        catch(x){ const t={bad_username:"Login 2–30 ta harf/raqam bo'lsin",password_too_short:'Parol juda qisqa',exists:'Bunday login bor'}; document.getElementById('am').innerHTML=`<div class="err">${t[x.error]||'Xatolik'}</div>`; }
      };
    }).catch(()=>{});
  } else {
    api('/api/admin/orders').then(list=>{
      document.getElementById('content').innerHTML = list.length ? `<table><tr><th>Sana</th><th>Buket</th><th>Mijoz</th></tr>${list.map(o=>`<tr><td>${new Date(o.createdAt).toLocaleString()}</td><td>${esc(o.product)}<br><small>${fmt(o.price)}</small></td><td>${esc(o.name)}<br>${esc(o.phone)}<br><small>${esc(o.address)}</small></td></tr>`).join('')}</table>` : `<p style="color:var(--muted)">Buyurtmalar yo'q.</p>`;
    }).catch(()=>{});
  }
}

let statMetric = 'qty';
const compact = n => n >= 1e6 ? (n/1e6).toFixed(n%1e6?1:0).replace(/\.0$/,'')+'M' : n >= 1e3 ? (n/1e3).toFixed(n%1e3?1:0).replace(/\.0$/,'')+'k' : String(n);
// Bar chart with X/Y axes, gridlines and value labels (inline SVG, no library)
function svgBars(items, o = {}){
  const W = 640, H = 270, L = 52, R = 12, T = 18, B = o.slant ? 70 : 44;
  const max = Math.max(0, ...items.map(i=>i.value));
  const step = (() => { if(!max) return 1; const raw = max/4, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; })();
  const top = step*4 || 4;
  const cw = (W-L-R)/Math.max(items.length,1), bw = Math.min(46, cw*0.62);
  const y = v => T + (H-T-B) * (1 - v/top);
  const every = Math.ceil(items.length/12);
  const grid = [0,1,2,3,4].map(i => { const v = step*i; return `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${i?'stroke-dasharray="3 3"':'stroke="#bbb"'}/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#777">${(o.fmt||compact)(v)}</text>`; }).join('');
  const bars = items.map((it,i) => {
    const x = L + cw*i + (cw-bw)/2, h = (H-B) - y(it.value);
    const lab = (i % every === 0) ? (o.slant
      ? `<text transform="translate(${x+bw/2},${H-B+14}) rotate(-35)" text-anchor="end" font-size="11" fill="#555">${esc(it.label)}</text>`
      : `<text x="${x+bw/2}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="#555">${esc(it.label)}</text>`) : '';
    const val = items.length <= 14 && it.value > 0 ? `<text x="${x+bw/2}" y="${y(it.value)-5}" text-anchor="middle" font-size="11" font-weight="600" fill="#333">${(o.fmt||compact)(it.value)}</text>` : '';
    return `<g><title>${esc(it.label)}: ${it.value}</title><rect x="${x}" y="${y(it.value)}" width="${bw}" height="${Math.max(h,it.value>0?2:0)}" rx="4" fill="${it.color||o.color||'var(--green)'}"/>${val}${lab}</g>`;
  }).join('');
  const axisTitle = o.yTitle ? `<text x="4" y="12" font-size="11" fill="#777">${esc(o.yTitle)}</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${axisTitle}${grid}<line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="#bbb"/>${bars}</svg>`;
}

async function renderStats(){
  const c = document.getElementById('content');
  c.onclick = null; c.onchange = null;
  c.innerHTML = '<p class="small">Yuklanmoqda…</p>';
  let s, recent;
  try { [s, recent] = await Promise.all([api('/api/admin/stats?days='+statDays), api('/api/admin/sales')]); } catch(x){ return; }
  const bar = (v, max, color) => `<div style="background:var(--line);border-radius:999px;height:8px;min-width:80px;flex:1"><div style="width:${max?Math.max(4,v/max*100):0}%;background:${color||'var(--green)'};height:8px;border-radius:999px"></div></div>`;
  const maxF = Math.max(0, ...s.topFlowers.map(f=>f.sold)), maxP = Math.max(0, ...s.topProducts.map(p=>p.qty));
  const periods = [[7,'7 kun'],[30,'30 kun'],[365,'1 yil'],[0,'Hammasi']];
  c.innerHTML = `
   <div class="filters">${periods.map(([d,l])=>`<button class="chip ${statDays===d?'on':''}" data-days="${d}">${l}</button>`).join('')}</div>
   <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px">
     <div class="panel" style="padding:14px"><small class="small">Daromad</small><div class="serif" style="font-size:26px">${fmt(s.revenue)}</div></div>
     <div class="panel" style="padding:14px"><small class="small">Sotilgan buketlar</small><div class="serif" style="font-size:26px">${s.bouquetsSold} ta</div></div>
     <div class="panel" style="padding:14px"><small class="small">Sotuvlar soni</small><div class="serif" style="font-size:26px">${s.salesCount}</div></div>
   </div>

   <div class="row2" style="align-items:center;margin-bottom:6px"><h3 class="serif" style="font-size:22px;flex:1">Sotuvlar grafigi</h3>
     <button class="chip ${statMetric==='qty'?'on':''}" data-metric="qty" style="flex:none">Buketlar soni</button><button class="chip ${statMetric==='revenue'?'on':''}" data-metric="revenue" style="flex:none">Daromad</button></div>
   <div style="margin-bottom:22px">${svgBars(s.series.map(b=>({label: s.daily ? b.key.slice(8)+'.'+b.key.slice(5,7) : b.key.slice(5,7)+'.'+b.key.slice(2,4), value: statMetric==='qty' ? b.qty : b.revenue})), {yTitle: statMetric==='qty'?'dona':"so'm", slant: s.series.length>14})}
     <div class="small" style="text-align:center">${s.daily ? 'Kunlar bo\'yicha' : 'Oylar bo\'yicha'}</div></div>

   ${s.topFlowers.length ? `<h3 class="serif" style="font-size:22px;margin-bottom:8px">Gullar grafigi <small class="small">(eng ko'p sotilgan)</small></h3><div style="margin-bottom:22px">${svgBars(s.topFlowers.map(f=>({label:f.name, value:f.sold})), {color:'#b07a2a', yTitle:'dona', slant:true})}</div>` : ''}

   <h3 class="serif" style="font-size:22px;margin-bottom:8px">Eng ko'p sotilgan gullar</h3>
   ${s.topFlowers.length ? s.topFlowers.map(f=>`<div class="row2" style="align-items:center;margin-bottom:6px"><span style="width:150px;flex:none">${esc(f.name)}</span>${bar(f.sold,maxF)}<b style="width:70px;flex:none;text-align:right">${f.sold} dona</b></div>`).join('') : '<p class="small">Hali sotuv yo\'q. Buketlar bo\'limida "Sotildi" ni bosing.</p>'}

   <h3 class="serif" style="font-size:22px;margin:22px 0 8px">Gullar kam qoldi <small class="small">(${s.thresholds.flowers} dona va undan kam)</small></h3>
   ${s.lowFlowers.length ? `<table>${s.lowFlowers.map(f=>`<tr><td>${esc(f.name)}</td><td style="text-align:right"><b style="color:${f.stock===0?'#b3261e':'#b36b00'}">${f.stock===0?'Tugagan':f.stock+' dona'}</b></td></tr>`).join('')}</table>` : '<p class="small">Kam qolgan gul yo\'q.</p>'}
   ${s.untrackedFlowers ? `<p class="small" style="margin-top:6px">${s.untrackedFlowers} ta gulning qoldig'i kiritilmagan, ular hisobga olinmaydi (Gullar bo'limida yozing).</p>` : ''}

   <h3 class="serif" style="font-size:22px;margin:22px 0 8px">Buketlar qoldig'i</h3>
   ${s.bouquets.length ? `<table>${s.bouquets.map(b=>`<tr><td>${esc(b.name)}</td><td style="text-align:right"><b style="color:${b.stock===0?'#b3261e':b.low?'#b36b00':'inherit'}">${b.stock===0?'Tugagan':b.stock+' ta'}</b></td></tr>`).join('')}</table>` : '<p class="small">Buketlarga qoldiq kiritilmagan.</p>'}

   <h3 class="serif" style="font-size:22px;margin:22px 0 8px">Eng ko'p sotilgan buketlar</h3>
   ${s.topProducts.length ? s.topProducts.map(p=>`<div class="row2" style="align-items:center;margin-bottom:6px"><span style="width:150px;flex:none">${esc(p.name)}</span>${bar(p.qty,maxP,'#b07a2a')}<b style="width:130px;flex:none;text-align:right">${p.qty} ta · ${fmt(p.total)}</b></div>`).join('') : '<p class="small">Hali sotuv yo\'q.</p>'}

   <h3 class="serif" style="font-size:22px;margin:22px 0 8px">Oxirgi sotuvlar</h3>
   ${recent.length ? `<table>${recent.slice(0,15).map(r=>`<tr><td>${new Date(r.at).toLocaleString()}</td><td>${esc(r.name)} × ${r.qty}</td><td>${fmt(r.total)}</td><td><button class="btn mini" data-undo="${r.id}">Bekor</button></td></tr>`).join('')}</table>` : '<p class="small">Sotuv yo\'q.</p>'}`;
  c.onclick = async e => {
    if(e.target.dataset.days!==undefined){ statDays=Number(e.target.dataset.days); renderStats(); }
    if(e.target.dataset.metric){ statMetric=e.target.dataset.metric; renderStats(); }
    if(e.target.dataset.undo && confirm('Sotuv bekor qilinsinmi? Qoldiq qaytariladi.')){ await api('/api/admin/sales/'+e.target.dataset.undo,'DELETE'); await load(); }
  };
}

function renderForm(){
  const p = editing || {name:'',price:'',tags:[],flowers:[],recipe:{}};
  const box = document.getElementById('formBox');
  box.innerHTML = `<h2 class="serif">${editing?'Buketni tahrirlash':"Yangi buket"}</h2><form id="pf">
   <label class="l">Nomi</label><input name="name" required value="${esc(p.name)}">
   <label class="l">Narxi (so'm)</label><input name="price" type="number" min="1" required value="${esc(p.price)}">
   <label class="l">Rasm</label><img class="preview" id="pv" ${p.image&&!removeImg?`src="${esc(p.image)}" style="display:block"`:''}><input type="file" id="file" accept="image/png,image/jpeg,image/webp">
   ${editing&&p.image?`<label class="l" style="cursor:pointer"><input type="checkbox" id="rmimg" style="width:auto;display:inline;margin:0 6px 0 0">Rasmni olib tashlash</label>`:''}
   <label class="l">Nechta buket bor (dona)</label><input name="stock" type="number" min="0" required value="${typeof p.stock==='number'?p.stock:1}">
   <label class="l">Gullar tarkibi (belgilang va bitta buketga nechta dona kirishini yozing)</label>
   <div class="checks">${Object.entries(FLOWERS).map(([k,v])=>{ const on=p.flowers.includes(k); const q=(p.recipe&&p.recipe[k])||1; return `<label><input type="checkbox" name="fl" value="${k}" ${on?'checked':''}>${v}<input type="number" class="rq" data-rq="${k}" min="1" max="999" value="${q}" title="Bitta buketga necha dona" style="width:54px;margin:0 0 0 4px;padding:3px 6px;${on?'':'display:none'}"></label>`; }).join('')}</div>
   <label class="l">Toifalar (katalog filtri)</label><div class="checks">${Object.entries(TAGS).map(([k,v])=>`<label><input type="checkbox" name="tg" value="${k}" ${p.tags.includes(k)?'checked':''}>${v}</label>`).join('')}</div>
   <small style="color:var(--muted)">Narx darajasi narxdan avtomatik: 1 mlngacha / 1–2 mln / 2 mln+</small>
   <div class="row2" style="margin-top:12px"><button class="btn dark" type="submit">${editing?'Saqlash':"Qo'shish"}</button>${editing?'<button class="btn" type="button" id="cancel">Bekor</button>':''}</div><div id="fm"></div></form>`;
  document.getElementById('file').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    if(f.size>5*1024*1024){ document.getElementById('fm').innerHTML='<div class="err">Rasm 5 MB dan kichik bo\'lsin</div>'; e.target.value=''; return; }
    const r = new FileReader(); r.onload = () => { imageData = r.result; const pv=document.getElementById('pv'); pv.src=r.result; pv.style.display='block'; }; r.readAsDataURL(f);
  };
  // show the quantity box only for checked flowers
  document.querySelectorAll('input[name=fl]').forEach(cb => cb.onchange = () => { const q = cb.parentElement.querySelector('.rq'); q.style.display = cb.checked ? '' : 'none'; });
  const rm = document.getElementById('rmimg'); if(rm) rm.onchange = e => { removeImg = e.target.checked; };
  const c = document.getElementById('cancel'); if(c) c.onclick = () => { editing=null; imageData=null; removeImg=false; renderForm(); };
  document.getElementById('pf').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const flowers = fd.getAll('fl');
    const recipe = {};
    flowers.forEach(id => { const inp = document.querySelector(`[data-rq="${id}"]`); recipe[id] = Math.max(1, Number(inp && inp.value) || 1); });
    const body = { name: fd.get('name'), price: Number(fd.get('price')), stock: Number(fd.get('stock')), flowers, recipe, tags: fd.getAll('tg') };
    if(imageData) body.image = imageData;
    if(removeImg && !imageData) body.removeImage = true;
    try {
      if(editing) await api('/api/admin/products/'+editing.id,'PUT',body); else await api('/api/admin/products','POST',body);
      const wasEdit = !!editing; editing=null; imageData=null; removeImg=false; await load();
      document.getElementById('fm').innerHTML = `<div class="ok">${wasEdit?'Saqlandi':"Buket qo'shildi"}</div>`;
    } catch(x){ document.getElementById('fm').innerHTML = `<div class="err">Xatolik: ${esc(x.error||'noma\'lum')}</div>`; }
  };
}

fetch('/api/admin/me').then(r=>r.json()).then(j=> j.authed ? showPanel() : showLogin());
</script>
</body>
</html>
